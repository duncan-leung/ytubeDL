name: Build Desktop Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allows manual 1-click trigger in GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller ytubeDL.spec

      - name: Package Windows Executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ytubeDL.exe -DestinationPath dist/ytubeDL-Windows.zip

      - name: Package macOS App
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/artifact
          cp -R dist/ytubeDL.app dist/artifact/
          cd dist
          zip -r ytubeDL-macOS.zip ytubeDL.app
          cd ..

      - name: Upload Windows Executable (Artifact)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ytubeDL-Windows
          path: dist/ytubeDL.exe

      - name: Upload macOS App (Artifact)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ytubeDL-macOS
          path: dist/artifact

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.0' }}
          name: ${{ github.ref_type == 'tag' && (startsWith(github.ref_name, 'v') && format('ytubeDL {0}', github.ref_name) || github.ref_name) || 'ytubeDL v2.0.0' }}
          draft: false
          prerelease: false
          files: |
            dist/ytubeDL.exe
            dist/ytubeDL-Windows.zip
            dist/ytubeDL-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

